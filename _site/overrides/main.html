{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.meta %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "headline": "{{ page.title | e }}",
    "description": "{{ page.meta.description or config.site_description | e }}",
    "author": {
      "@type": "Person",
      "name": "{{ config.site_author | e }}"
    },
    "url": "{{ page.canonical_url | e }}"
    {% if page.meta.created %},"datePublished": "{{ page.meta.created }}"{% endif %}
    {% if page.meta.updated %},"dateModified": "{{ page.meta.updated }}"{% endif %}
  }
  </script>
  {% endif %}
{% endblock %}
