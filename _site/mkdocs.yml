site_name: vi226035 的知识库
site_description: vi226035 的个人知识库——信号处理、数字硬件（FPGA/数字IC/数字电路）与机器学习学习笔记
site_author: vi226035
site_url: https://vi226035.github.io/my-knowledge-base/

# 配置文件位于 _site/，vault 根目录是 MkDocs 源目录
docs_dir: ..
# MkDocs 要求 site_dir 不能位于 docs_dir 内部，
# 因此构建输出到仓库外的 D:/site_build（部署后可由 gh-deploy 推送）
site_dir: ../../site_build
strict: false

repo_name: vi226035/my-knowledge-base
repo_url: https://github.com/vi226035/my-knowledge-base

theme:
  name: material
  language: zh
  font: false
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: _site/assets/logo.svg
  favicon: _site/assets/favicon.svg

extra:
  generator: false
  analytics:
    provider: google
    property: G-S17BB74PGE

exclude_docs: |
  .git/**
  .obsidian/**
  .claude/**
  .claudian/**
  __pycache__/**
  site/**
  CLAUDE.md
  CLAUDE-CLIPPINGS.md
  _site/mkdocs.yml
  _site/hooks.py
  _site/requirements.txt
  _site/robots.txt
  _site/overrides/**
  _site/kb_material/**/*.md
  _site/kb_material/**/*.json
  _site/kb_material/**/*_model.json
  _site/kb_material/**/*_content_list.json
  _site/kb_material/**/block_list.json
  _site/kb_material/**/content_list_v2.json
  _site/kb_material/**/layout.json
  _site/knowledge_base_material/**
  **/*.excalidraw.md

hooks:
  - hooks.py

plugins:
  - search:
      lang: zh
  # social 插件需联网下载 Google Fonts 生成卡片，离线构建会超时，暂注释
  # - social:
  #     cards_layout_options:
  #       font_family: Noto Sans SC
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      locale: zh
      enable_git_follow: false

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.details
  - toc:
      permalink: true

extra_javascript:
  - _site/javascripts/katex.min.js
  - _site/javascripts/katex.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - _site/javascripts/mermaid-init.js

extra_css:
  - _site/stylesheets/katex.min.css
  - _site/stylesheets/extra.css

nav:
  - 首页: index.md
  - 深度学习:
      - 神经网络: 深度学习/神经网络.md
      - 卷积神经网络（CNN）: 深度学习/卷积神经网络（CNN）.md
      - 循环神经网络（RNN）: 深度学习/循环神经网络（RNN）.md
      - 长短期记忆网络（LSTM）: 深度学习/长短期记忆网络（LSTM）.md
      - 门控循环单元（GRU）: 深度学习/门控循环单元（GRU）.md
      - 常见疑惑解答: 深度学习/一些疑惑解答.md
      - 应用场景与选型: 深度学习/神经网络应用场景与选型.md
      - 梯度下降优化算法: 深度学习/梯度下降优化算法.md
      - 时域卷积网络（TCN）: 深度学习/时域卷积网络（TCN）.md
  - PyTorch 入门:
      - PyTorch 入门: Pytorch入门/Pytorch入门.md
      - Python 语法全览: Pytorch入门/Python语法.md
  - 信号处理:
      - DDC（数字下变频）: 信号处理/数字下变频（DDC）.md
      - DUC（数字上变频）: 信号处理/数字上变频（DUC）.md
      - 雷达数字信号中频接收: 信号处理/雷达数字信号中频接收.md
      - 雷达信号检测: 信号处理/雷达信号检测.md
      - 雷达信号调制类型识别: 信号处理/雷达信号调制类型识别.md
      - 干涉仪测向原理: 信号处理/干涉仪原理.md
      - 空间谱估计与 MUSIC 算法: 信号处理/空间谱估计与 MUSIC 算法.md
      - 并行双边 Jacobi 旋转特征值分解: 信号处理/并行双边Jacobi旋转特征值分解.md
      - 分数阶延迟滤波器（Farrow 结构）: 信号处理/分数阶延迟(Farrow).md
  - 数字对消:
      - 专业名词与缩写: 数字对消/对消常见专业名词.md
      - 线性对消方法: 数字对消/线性对消.md
      - 非线性对消方法: 数字对消/非线性对消.md
  - FPGA:
      - FPGA: FPGA/index.md
      - 数字电路基础: FPGA/数字电路基础.md
      - 组合逻辑电路: FPGA/组合逻辑电路.md
      - 时序逻辑电路: FPGA/时序逻辑电路.md
      - FPGA 校招面试八股: FPGA/FPGA校招面试八股.md
      - 校招笔试真题集: FPGA/校招笔试真题集.md
      - DFT 中的旋转因子 W 的理解: FPGA/DFT中的旋转因子W的理解.md
      - UART 串行通信协议: FPGA/UART串行通信协议.md
      - SPI 串行通信协议: FPGA/SPI串行通信协议.md
      - I2C 串行通信协议: FPGA/I2C串行通信协议.md
  - 数字IC:
      - 数字IC: 数字IC/index.md
      - 数字芯片设计与验证概述: 数字IC/数字芯片设计与验证概述.md
      - Verilog HDL 核心语法与建模: 数字IC/Verilog HDL核心语法与建模.md
      - SystemVerilog 基础语法: 数字IC/SystemVerilog基础语法.md
      - SystemVerilog 核心特性: 数字IC/SystemVerilog核心特性.md
      - 高性能数字电路设计: 数字IC/高性能数字电路设计.md
      - UVM 验证方法学入门: 数字IC/UVM验证方法学入门.md
      - 数字芯片设计与验证全流程: 数字IC/数字芯片设计与验证全流程.md
  - 软件秘籍:
      - MathType 永久免费使用教程: 软件秘籍/MathType 永久免费使用教程.md
